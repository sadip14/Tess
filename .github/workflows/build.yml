name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Device_Monitor_Project_final.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Sign release with debug key
        run: |
          cat > "$RUNNER_TEMP/sign.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android.buildTypes.release.signingConfig = p.android.signingConfigs.debug
              }
            }
          }
          EOF
      - name: Build release
        working-directory: project
        run: gradle assembleRelease --init-script "$RUNNER_TEMP/sign.gradle" --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Device-Monitor-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
